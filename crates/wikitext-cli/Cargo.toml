[package]
name = "wikitext-cli"
description = "Command line Wikitext to HTML compiler"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "wikitext"
path = "src/main.rs"

[dependencies]
wikitext = { workspace = true, features = ["lua"] }
wikitext-convert = { workspace = true }
clap = { version = "4", features = ["derive"] }
